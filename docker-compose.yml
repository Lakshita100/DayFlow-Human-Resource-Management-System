services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow

    ports:
      - "5434:5432"

    volumes:
      - dayflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dayflow_postgres_data:
    driver: local
